<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="@sovgut/datagrid">
  <title>@sovgut/datagrid</title>
  <style>
    svg { --ink: #1C1917; --accent: #E08A0B; }
    @media (prefers-color-scheme: dark) { svg { --ink: #EDE9E4; --accent: #F2A63C; } }
  </style>
  <!-- Header row: the state the package owns. The middle segment is the sorted column. -->
  <rect x="2" y="3" width="6" height="4" rx="1.2" fill="var(--ink)" />
  <rect x="9" y="3" width="6" height="4" rx="1.2" fill="var(--accent)" />
  <rect x="16" y="3" width="6" height="4" rx="1.2" fill="var(--ink)" />
  <!-- Body cells: the markup you bring. Outlined, because the package renders none of it. -->
  <g fill="none" stroke="var(--ink)" stroke-width="1.25" opacity="0.4">
    <rect x="2.6" y="9.6" width="4.8" height="3.8" rx="1" />
    <rect x="9.6" y="9.6" width="4.8" height="3.8" rx="1" />
    <rect x="16.6" y="9.6" width="4.8" height="3.8" rx="1" />
    <rect x="2.6" y="15.6" width="4.8" height="3.8" rx="1" />
    <rect x="9.6" y="15.6" width="4.8" height="3.8" rx="1" />
    <rect x="16.6" y="15.6" width="4.8" height="3.8" rx="1" />
  </g>
</svg>
